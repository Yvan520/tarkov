name: Daily Content Update

on:
  workflow_dispatch:

jobs:
  update-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Collect content
        run: python tools/content_collector.py

      - name: Write articles & regenerate
        run: python tools/content_writer.py

      - name: Commit and push
        run: |
          git config user.name "tarkov-bot"
          git config user.email "bot@tarkov.gamewayz.com"
          git add -A
          git diff --cached --stat | tail -1
          git commit -m "auto: daily content update $(date +%Y-%m-%d)" || echo "No changes"
          git push
